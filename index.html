        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f4f9; }
        .app-container { display: flex; height: 100vh; flex-direction: column; }
        .main-content { display: flex; flex: 1; overflow: hidden; }

        .search-results-header {
            display: grid;
            grid-template-columns: 80px 1fr 100px;
            background: #f1f1f1;
            font-weight: bold;
            font-size: 0.75em;
            padding: 5px;
            border-bottom: 2px solid #ccc;
            position: sticky;
            top: 0;
        }

        .search-result-row {
            display: grid;
            grid-template-columns: 80px 1fr 100px;
            gap: 5px;
            padding: 8px 5px;
            border-bottom: 1px solid #eee;
            font-size: 0.75em;
            cursor: pointer;
            align-items: center;
        }

        .search-result-row:hover { background-color: #e7f3ff; }
        
        #sidebar { 
            width: 380px; 
            padding: 20px; 
            background: white; 
            border-right: 2px solid #ddd; 
            overflow-y: auto; 
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
        }
        
        #map { 
    flex: 1; 
    height: 100vh; /* This tells the map to fill the full height of the screen */
    background: #ddd; 
}
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9em; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        button { cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        #lookupBtn { background: #7a7d6c; color: white; width: 80px; }
        #saveBtn { background: #007bff; color: white; width: 100%; padding: 15px; margin-top: 10px; font-size: 1em; }
        
        .stats { font-weight: bold; color: #333; margin-bottom: 10px; }
        hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }
    </style>

    // --- 3. DROPDOWNS ---
    function populateSearchDropdowns() {
        const counties = new Set();
        const subdivisions = new Set();
        const clients = new Set();

        window.allRawJobs.forEach(job => {
            if (job.county) counties.add(job.county.trim());
            if (job.subdivision) subdivisions.add(job.subdivision.trim());
            if (job.client_name) clients.add(job.client_name.trim());
        });

        const fill = (ids, set, label) => {
            ids.forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                const currentVal = el.value;
                el.innerHTML = `<option value="">-- Select ${label} --</option>`;
                Array.from(set).sort().forEach(val => {
                    const opt = document.createElement('option');
                    opt.value = val; opt.textContent = val;
                    el.appendChild(opt);
                });
                el.value = currentVal;
            });
        };

        fill(['search_county', 'new_county'], counties, "County");
        fill(['search_subdivision', 'new_subdivision'], subdivisions, "Subdivision");
        fill(['search_client', 'new_client'], clients, "Client");
    }

        window.allRawJobs = data; 
        clusters.clearLayers();
        window.allMarkers = [];
        
        data.forEach(job => addMarkerToMap(job));
        populateSearchDropdowns();
        
        document.getElementById('job-count').innerText = "Total Database: " + data.length + " Jobs";

        const countyVal = document.getElementById('search_county') ? document.getElementById('search_county').value.toLowerCase() : '';
        const clientVal = document.getElementById('search_client') ? document.getElementById('search_client').value.toLowerCase() : '';
        const addrVal = document.getElementById('search_address') ? document.getElementById('search_address').value.toLowerCase().trim() : '';
        const typeVal = document.getElementById('search_type') ? document.getElementById('search_type').value.toLowerCase() : '';
        
        // Grab the date range inputs safely
        const startInput = document.getElementById('search_date_start') ? document.getElementById('search_date_start').value : '';
        const endInput = document.getElementById('search_date_end') ? document.getElementById('search_date_end').value : '';
        
        const startDateObj = startInput ? new Date(startInput + 'T00:00:00') : null;
        const endDateObj = endInput ? new Date(endInput + 'T23:59:59') : null;
        
        if (clusters) clusters.clearLayers();
        let matchCount = 0;

        let listHTML = `
            <div class="search-results-header" style="display: grid; grid-template-columns: 70px 1fr 110px; gap: 5px; font-weight: bold; padding: 5px; border-bottom: 2px solid #ddd;">
                <div>Job #</div>
                <div>Address</div>
                <div style="text-align: center;">Action</div>
            </div>`;

        if (window.allRawJobs) {
            window.allRawJobs.forEach(job => {
                const jNum = String(job.job_number || "").toLowerCase().trim();
                const jLotNum = String(job.lot_number || "").toLowerCase().trim();
                const jLandLot = String(job.land_lot || "").toLowerCase().trim();
                const jSub = String(job.subdivision || "").toLowerCase().trim();
                const jCounty = String(job.county || "").toLowerCase().trim();
                const jClient = String(job.client_name || "").toLowerCase().trim();
                const jAddr = String(job.address || "").toLowerCase();
                const jType = String(job.project_type || "").toLowerCase().trim();

                const mJob = !jobVal || jNum.includes(jobVal);
                const mLotNum = !lotNumVal || jLotNum === lotNumVal;
                const mLandLot = !lotVal || jLandLot.includes(lotVal);
                const mSub = !subVal || jSub === subVal;
                const mCounty = !countyVal || jCounty === countyVal;
                const mClient = !clientVal || jClient === clientVal;
                const mAddr = !addrVal || jAddr.includes(addrVal);
                const mType = !typeVal || jType === typeVal;

                // Date Range Check
                let mDate = true; // Default to true if no filters are selected

            if (startInput || endInput) {
                if (job.date_entered) {
                    // job.date_entered is already formatted as YYYY-MM-DD from Supabase!
                    const jobDateText = String(job.date_entered).trim(); 

                    // Directly compare the text strings alphabetically/chronologically
                    if (startInput && jobDateText < startInput) mDate = false;
                    if (endInput && jobDateText > endInput) mDate = false;
                } else {
                    // Hide rows that have blank dates if the user is filtering by a date range
                    mDate = false;
                }
            }

                if (mJob && mLotNum && mLandLot && mSub && mCounty && mClient && mAddr && mType && mDate) {
                    matchCount++;
                    window.currentFilteredJobs.push(job);

                    if (window.allMarkers) {
                        const marker = window.allMarkers.find(m => String(m.jobData.job_number).trim() == jNum);
                        if (marker && clusters) clusters.addLayer(marker);
                    }

                    listHTML += `

                        </div>
                    </div>`;
                }
            });

                        🖨️ Print Filtered List (${matchCount} Rows)
                    </button>`;
                resultsEl.innerHTML = printListBtnHtml + listHTML;
            } else {
                resultsEl.innerHTML = listHTML + `<div style="text-align:center; padding:10px; color:#666;">No matches found</div>`;
            }
        }

        const countEl = document.getElementById('job-count');
        if (countEl) countEl.innerText = `Matches: ${matchCount}`;
    };

    // --- CLONE ENGINE WORKFLOW ---
    window.handleCopyJobSetup = function(jobNum) {
        // 1. Locate the master template source job
        const sourceJob = window.allRawJobs.find(j => String(j.job_number).trim() == String(jobNum).trim());
        if (!sourceJob) return alert("Source job template not found.");

        // 2. Open the Log New Job Modal and update its header state
        modal.style.display = 'block';
        modal.querySelector('h2').innerText = "Log New Job (Cloned from #" + jobNum + ")";
        
        // Remove any old dataset links so the system knows this is an INSERT, not an UPDATE
        delete document.getElementById('jobModal').dataset.currentId;

        // 3. Keep the template values completely editable for the operator
        document.getElementById('new_job_number').readOnly = false;
        document.getElementById('new_subdivision').value = sourceJob.subdivision || '';
        document.getElementById('new_client').value = sourceJob.client_name || '';
        document.getElementById('new_project_type').value = sourceJob.project_type || '';
        document.getElementById('new_county').value = sourceJob.county || '';
        document.getElementById('new_land_lot').value = sourceJob.land_lot || '';

        // 4. Wipe out the specific old physical lot details so you don't accidentally double-log them
        document.getElementById('new_lot_number').value = '';
        document.getElementById('address_search').value = '';
        document.getElementById('new_lat').value = '';
        document.getElementById('new_lng').value = '';

        // 5. Calculate and advance the job number counter sequentially
        if (window.allRawJobs && window.allRawJobs.length > 0) {
            const numbers = window.allRawJobs.map(j => parseInt(j.job_number)).filter(num => !isNaN(num));
            if (numbers.length > 0) {
                document.getElementById('new_job_number').value = Math.max(...numbers) + 1;
            }
        }

        // 6. Map the Save Button explicitly to handle an INSERT execution rule
        const saveBtn = document.getElementById('saveBtn');
        saveBtn.innerText = "SAVE CLONED JOB";
        saveBtn.style.background = "#dc3545"; // Red style indicating clone mode action
        saveBtn.style.color = "white";

        saveBtn.onclick = async () => {
            const subManual = document.getElementById('new_subdivision_manual').value;
            const finalSub = subManual ? subManual : document.getElementById('new_subdivision').value;
            const clientManual = document.getElementById('new_client_manual').value;
            const finalClient = clientManual ? clientManual : document.getElementById('new_client').value;
            
            // Format current date matching your standard ISO setup (YYYY-MM-DD)
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            const formattedDate = `${yyyy}-${mm}-${dd}`;

            const clonedJobData = {
                job_number: document.getElementById('new_job_number').value,
                subdivision: finalSub,
                client_name: finalClient,
                project_type: document.getElementById('new_project_type').value,
                lot_number: document.getElementById('new_lot_number').value,
                county: document.getElementById('new_county').value,
                address: document.getElementById('address_search').value,
                land_lot: document.getElementById('new_land_lot').value,
                latitude: parseFloat(document.getElementById('new_lat').value) || 0,
                longitude: parseFloat(document.getElementById('new_lng').value) || 0,
                date_entered: formattedDate 
            };

            const { error } = await window._supabase.from('jobs').insert([clonedJobData]);
            if (!error) { 
                modal.style.display = "none"; 
                alert("New Job Logged from Template!"); 
                await loadJobsFromDatabase(); 
            } else { 
                alert("Database Error: " + error.message); 
            }
        };
    };

    function autofillNextJobNumber() {
        if (!window.allRawJobs || window.allRawJobs.length === 0) return;
        const numbers = window.allRawJobs.map(job => parseInt(job.job_number)).filter(num => !isNaN(num));
        if (numbers.length > 0) {
            document.getElementById('new_job_number').value = Math.max(...numbers) + 1;
        }
    }

    document.getElementById('openModalBtn').onclick = () => {
        modal.querySelector('h2').innerText = "Log New Job";
        const saveBtn = document.getElementById('saveBtn');
        saveBtn.innerText = "SAVE TO DATABASE";
        saveBtn.style.background = "#28a745";
        saveBtn.style.color = "white";
        
        document.getElementById('new_job_number').readOnly = false;
        document.getElementById('new_job_number').value = '';
        document.getElementById('new_lot_number').value = '';
        document.getElementById('address_search').value = '';
        document.getElementById('new_lat').value = '';
        document.getElementById('new_lng').value = '';

        saveBtn.onclick = async () => {
            const subManual = document.getElementById('new_subdivision_manual').value;
            const finalSub = subManual ? subManual : document.getElementById('new_subdivision').value;
            const clientManual = document.getElementById('new_client_manual').value;
            const finalClient = clientManual ? clientManual : document.getElementById('new_client').value;
            const today = new Date();
            const formattedDate = (today.getMonth() + 1) + '/' + today.getDate() + '/' + today.getFullYear();

            const jobData = {
                job_number: document.getElementById('new_job_number').value,
                subdivision: finalSub,
                client_name: finalClient,
                project_type: document.getElementById('new_project_type').value,
                lot_number: document.getElementById('new_lot_number').value,
                county: document.getElementById('new_county').value,
                address: document.getElementById('address_search').value,
                latitude: parseFloat(document.getElementById('new_lat').value),
                longitude: parseFloat(document.getElementById('new_lng').value),
                date_entered: formattedDate 
            };

            const { error } = await window._supabase.from('jobs').insert([jobData]);
            if (!error) { 
                modal.style.display = "none"; 
                alert("Job Logged!"); 
                await loadJobsFromDatabase(); 
            } else { alert("Error: " + error.message); }
        };
        autofillNextJobNumber();
        modal.style.display = "block";
    };

    window.focusOnJob = function(jobNum) {
        const m = window.allMarkers.find(marker => String(marker.jobData.job_number).trim() == String(jobNum).trim());
        if (m) { map.setView(m.getLatLng(), 18); m.openPopup(); }
    };

    document.getElementById('closeModal').onclick = () => { modal.style.display="none"; };
    document.getElementById('applyFiltersBtn').onclick = applyCivilTrackerFilters;
    document.getElementById('resetFiltersBtn').onclick = () => {
        document.querySelectorAll('.sidebar input, .sidebar select').forEach(el => el.value = '');
        document.getElementById('searchResultsList').innerHTML = '';
        document.getElementById('search_date_start').value = '';
        document.getElementById('search_date_end').value = '';
        loadJobsFromDatabase();
    };

    document.getElementById('lookupBtn').onclick = async () => {
        const addressInput = document.getElementById('address_search');
        let address = addressInput.value;
        if (!address) return alert("Enter an address.");
        if (!address.toLowerCase().includes("ga")) address += ", Georgia";

        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&viewbox=-85.6,33.5,-81.0,35.2&bounded=1`;
        const response = await fetch(url);
        const results = await response.json();

        if (results.length > 0) {
            const lat = parseFloat(results[0].lat);
            const lon = parseFloat(results[0].lon);
            document.getElementById('new_lat').value = lat.toFixed(6);
            document.getElementById('new_lng').value = lon.toFixed(6);
            map.flyTo([lat, lon], 17); 
        } else { alert("Address not found."); }
    };

    // --- MANUAL MAP PICKER WORKFLOW ---
    document.getElementById('manualLocateBtn').onclick = function() {
        // 1. Hide the modal temporarily
        modal.style.display = "none";
        
        // 2. Change the map cursor to a crosshair to signal "pick mode"
        document.getElementById('map').style.cursor = 'crosshair';
        
        // 3. Inform the user visually (optional but helpful toast/alert)
        const tip = document.createElement('div');
        tip.id = "map-pick-tip";
        tip.innerHTML = "🎯 Click anywhere on the map to set coordinates...";
        tip.style = "position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; z-index: 2000; font-family: Arial; font-weight: bold;";
        document.body.appendChild(tip);

        // 4. Set up a one-time click listener on the map
        map.once('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;

            // Fill the form inputs behind the scenes
            document.getElementById('new_lat').value = lat.toFixed(6);
            document.getElementById('new_lng').value = lng.toFixed(6);

            // Clean up the crosshair cursor and the helpful floating tip
            document.getElementById('map').style.cursor = '';
            const existingTip = document.getElementById('map-pick-tip');
            if (existingTip) existingTip.remove();

            // 5. Reopen the modal with everything preserved!
            modal.style.display = "block";
            
            // Visual check: Fly the map slightly to center on their chosen pin
            map.flyTo([lat, lng], map.getZoom());
        });
    };

    // --- GLOBAL ESCAPE KEY LISTENER ---
    window.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' || e.keyCode === 27) {
            // 1. Close any open marker bubbles on the Leaflet map
            if (map) {
                map.closePopup();
            }

            // 2. FORCE CANCEL THE MANUAL MAP PICKER IF ACTIVE
            // Reset the cursor style back to default
            const mapEl = document.getElementById('map');
            if (mapEl) mapEl.style.cursor = '';
            
            // Remove the floating floating tip message if it exists
            const existingTip = document.getElementById('map-pick-tip');
            if (existingTip) existingTip.remove();
            
            // CRITICAL: Tells Leaflet to stop waiting for that map click!
            if (map) {
                map.off('click'); 
            }

            // 3. Close the Log/Edit Job Modal if open
            const jobModal = document.getElementById("jobModal");
            if (jobModal && jobModal.style.display === 'block') {
                if (window.tempNewJobMarker) {
                    map.removeLayer(window.tempNewJobMarker);
                    window.tempNewJobMarker = null;
                }
                jobModal.style.display = "none";
            }
        }
    });
    
    // --- 8. WORK ORDER GENERATOR ---
    window.generateWorkOrder = async function(job) {
    if (typeof job === 'string') {
        job = window.allRawJobs.find(j => String(j.job_number).trim() === job.trim());
    }
    if (!job) return alert("Job data not found.");

    const printWindow = window.open('', '_blank', 'width=900,height=800');

    // Fetch the client details (including billing_address)
    const { data: client } = await window._supabase
        .from('clients')
        .select('*')
        .eq('company_name', job.client_name)
        .single();

    const html = `
    <html>
    <head>
        <title>Work Order - ${job.job_number}</title>
        <style>
            body { font-family: Arial, sans-serif; padding: 40px; }
            table { width: 100%; border-collapse: collapse; margin-top: 20px; }
            td { border: 2px solid black; padding: 15px; vertical-align: top; }
            .section-title { font-weight: bold; text-decoration: underline; text-align: center; display: block; margin-bottom: 8px; }
            @media print { .no-print { display: none; } }
        </style>
    </head>
    <body>
        <button class="no-print" onclick="window.print()">Print Report</button>
        <table>
            <tr>
                <td colspan="2" style="text-align: center; font-size: 1.2em;">
                    <b>Order #:</b> ${job.job_number} &nbsp;&nbsp;&nbsp; <b>Date:</b> ${job.date_entered || '---'}
                </td>
            </tr>
            <tr>
                <td style="width: 50%;">
                    <span class="section-title">Parcel Legal</span>
                    <b>Address:</b> ${job.address || '---'}<br>
                    <b>Subdivision:</b> ${job.subdivision || '---'}<br>
                    <b>Lot:</b> ${job.lot_number || '---'}<br>
                    <b>Land Lot:</b> ${job.land_lot || '---'}
                </td>
                
                <td style="width: 50%;">
    <span class="section-title">Client Information</span>
    <b>Company:</b> ${job.client_name || '---'}<br>
    ${client ? `
        <b>Contact:</b> ${client.contact_name || '---'}<br>
        ${client.email || ''}<br>
        ${client.phone_number || ''}
    ` : '<i>No additional info found</i>'}
</td>
            </tr>
            <tr>
                <td colspan="2">
                    <span class="section-title">Billing Information</span>
                    <div style="text-align: center;">
                        ${client && client.billing_address ? client.billing_address : '<i>No billing address on file</i>'}
                    </div>
                </td>
            </tr>
        </table>
    </body` + `></html` + `>`;

    printWindow.document.write(html);
    printWindow.document.close();
};

    // Start App
    loadJobsFromDatabase();
});
</script>
</body>
</html>
