        .search-results-header {
            display: grid;
            grid-template-columns: 80px 1fr 100px;
            background: #f1f1f1;
            font-weight: bold;
            font-size: 0.75em;
            padding: 5px;
            border-bottom: 2px solid #ccc;
            position: sticky;
            top: 0;
        }

        .search-result-row {
            display: grid;
            grid-template-columns: 80px 1fr 100px;
            gap: 5px;
            padding: 8px 5px;
            border-bottom: 1px solid #eee;
            font-size: 0.75em;
            cursor: pointer;
            align-items: center;
        }

        .search-result-row:hover { background-color: #e7f3ff; }
        
        #sidebar { 
            width: 380px; 
            padding: 20px; 
            background: white; 
            border-right: 2px solid #ddd; 
            overflow-y: auto; 
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);

        #map { 
    flex: 1;

    background: #ddd; 
}
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9em; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        button { cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        #lookupBtn { background: #7a7d6c; color: white; width: 80px; }
        #saveBtn { background: #007bff; color: white; width: 100%; padding: 15px; margin-top: 10px; font-size: 1em; }
        
        .stats { font-weight: bold; color: #333; margin-bottom: 10px; }
        hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Safety Check: Wait for libraries to load
    if (typeof L === 'undefined' || typeof supabase === 'undefined') {
        console.error("Leaflet or Supabase libraries not loaded. Retrying in 1 second...");
        setTimeout(() => location.reload(), 1000);
        return;
    }

    // --- INITIALIZE MAP ---
    const map = L.map('map').setView([34.0304, -84.5269], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
        attribution: '© OpenStreetMap' 
    }).addTo(map);

    const clusters = L.markerClusterGroup(); 
    map.addLayer(clusters); 

    // --- SUPABASE CONFIG ---
    const SUPABASE_URL = "https://italxfydjdwrhufaedwp.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0YWx4ZnlkamR3cmh1ZmFlZHdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwMDIwNjIsImV4cCI6MjA5MTU3ODA2Mn0.mJn7zNu32n9GAFHBcnHYzUNwicyGDFGL5cnG2Lj49aw"; 
    
    window._supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    window.allRawJobs = [];
    window.allMarkers = [];
    
    const modal = document.getElementById("jobModal");

    // --- 1. TOGGLE INPUTS (FOR NEW SUB/CLIENT) ---
    window.toggleNewInput = function(type) {
        const drop = document.getElementById(type === 'sub' ? 'sub_dropdown_wrap' : 'client_dropdown_wrap');
        const text = document.getElementById(type === 'sub' ? 'sub_text_wrap' : 'client_text_wrap');
        
        if (drop.style.display === 'none') {
            drop.style.display = 'block';
            text.style.display = 'none';
            document.getElementById(type === 'sub' ? 'new_subdivision_manual' : 'new_client_manual').value = '';
        } else {
            drop.style.display = 'none';
            text.style.display = 'block';
        }
    };

    // --- 2. MARKER CREATION ---
    function addMarkerToMap(job) {
        const lat = parseFloat(job.latitude);
        const lng = parseFloat(job.longitude);

        if (!job.latitude || !job.longitude || isNaN(lat) || isNaN(lng)) return;

        const marker = L.marker([lat, lng]);
        
        marker.bindPopup(`
            <div style="min-width: 200px; font-family: 'Segoe UI', sans-serif;">
                <h4 style="margin: 0 0 8px 0; color: #007bff; border-bottom: 1px solid #ddd; padding-bottom: 5px;">
                    Job #${job.job_number}
                </h4>
                <div style="font-size: 0.9em; line-height: 1.4;">
                    <p style="margin: 4px 0;"><b>Address:</b> ${job.address || '---'}</p>
                    <p style="margin: 4px 0;"><b>Land Lot:</b> ${job.land_lot || '---'}</p>
                    <p style="margin: 4px 0;"><b>Lot Number:</b> ${job.lot_number || 'N/A'}</p>
                    <p style="margin: 4px 0;"><b>Project Type:</b> ${job.project_type || '---'}</p>
                    <p style="margin: 4px 0;"><b>Client Name:</b> ${job.client_name || '---'}</p>
                </div>
                <div style="margin-top: 10px; padding-top: 8px; border-top: 1px dashed #ccc; font-size: 0.8em; color: #666;">
                    <p style="margin: 2px 0;"><b>Subdivision:</b> ${job.subdivision || 'None'}</p>
                    <p style="margin: 2px 0;"><b>Date Entered:</b> ${job.date_entered || '---'}</p>
                </div>
                <button onclick="generateWorkOrder('${job.job_number}')" style="flex: 1; background:#007bff; color:white; border:none; padding:8px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:0.85em;">
                        Work Order
                    </button>
                    <button onclick="openEditModal('${job.job_number}')" style="flex: 1; background:#ffc107; color:black; border:none; padding:8px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:0.85em;">
                        Edit Info
                    </button>
                </div>
            </div>
        `);
        
        marker.jobData = job; 
        clusters.addLayer(marker); 
        window.allMarkers.push(marker);
    }

    // --- 3. DROPDOWNS ---
    function populateSearchDropdowns() {
        const counties = new Set();
        const subdivisions = new Set();
        const clients = new Set();

        window.allRawJobs.forEach(job => {
            if (job.county) counties.add(job.county.trim());
            if (job.subdivision) subdivisions.add(job.subdivision.trim());
            if (job.client_name) clients.add(job.client_name.trim());
        });

        const fill = (ids, set, label) => {
            ids.forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                const currentVal = el.value;
                el.innerHTML = `<option value="">-- Select ${label} --</option>`;
                Array.from(set).sort().forEach(val => {
                    const opt = document.createElement('option');
                    opt.value = val; opt.textContent = val;
                    el.appendChild(opt);
                });
                el.value = currentVal;
            });
        };

        fill(['search_county', 'new_county'], counties, "County");
        fill(['search_subdivision', 'new_subdivision'], subdivisions, "Subdivision");
        fill(['search_client', 'new_client'], clients, "Client");
    }

    // --- 4. DATABASE LOADING ---
    async function loadJobsFromDatabase() {
        const { data, error } = await window._supabase
            .from('jobs')
            .select('*')
            .range(0, 5000) 
            .order('job_number', { ascending: false });

        if (error) return console.error(error);
        
        window.allRawJobs = data; 
        clusters.clearLayers();
        window.allMarkers = [];
        
        data.forEach(job => addMarkerToMap(job));
        populateSearchDropdowns();
        
        document.getElementById('job-count').innerText = "Total Database: " + data.length + " Jobs";
    }

    // --- 5. SEARCH & FILTERING ---
    window.applyCivilTrackerFilters = function() {
        const jobVal = document.getElementById('search_job_num').value.toLowerCase().trim();
        const lotNumVal = document.getElementById('search_lot_num').value.toLowerCase().trim();
        const lotVal = document.getElementById('search_land_lot').value.toLowerCase().trim();
        const subVal = document.getElementById('search_subdivision').value.toLowerCase();
        const countyVal = document.getElementById('search_county').value.toLowerCase();
        const clientVal = document.getElementById('search_client').value.toLowerCase();
        const addrVal = document.getElementById('search_address').value.toLowerCase().trim();
        const typeVal = document.getElementById('search_type').value.toLowerCase();
        
        const dateInput = document.getElementById('search_date').value;
        let formattedSearchDate = "";
        if (dateInput) {
            const [y, m, d] = dateInput.split('-');
            formattedSearchDate = `${parseInt(m)}/${parseInt(d)}/${y}`;
        }
        
        clusters.clearLayers();
        let matchCount = 0;
        let listHTML = `<div class="search-results-header"><div>Job #</div><div>Subdivision</div><div>Action</div></div>`;

        window.allRawJobs.forEach(job => {
            const jNum = String(job.job_number || "").toLowerCase().trim();
            const jLotNum = String(job.lot_number || "").toLowerCase().trim();
            const jLandLot = String(job.land_lot || "").toLowerCase().trim();
            const jSub = String(job.subdivision || "").toLowerCase().trim();
            const jCounty = String(job.county || "").toLowerCase().trim();
            const jClient = String(job.client_name || "").toLowerCase().trim();
            const jAddr = String(job.address || "").toLowerCase();
            const jType = String(job.project_type || "").toLowerCase().trim();

            const mJob = !jobVal || jNum.includes(jobVal);
            const mLotNum = !lotNumVal || jLotNum === lotNumVal;
            const mLandLot = !lotVal || jLandLot.includes(lotVal);
            const mSub = !subVal || jSub === subVal;
            const mCounty = !countyVal || jCounty === countyVal;
            const mClient = !clientVal || jClient === clientVal;
            const mAddr = !addrVal || jAddr.includes(addrVal);
            const mType = !typeVal || jType === typeVal;
            const mDate = !formattedSearchDate || (job.date_entered === formattedSearchDate);

            if (mJob && mLotNum && mLandLot && mSub && mCounty && mClient && mAddr && mType && mDate) {
                matchCount++;
                const marker = window.allMarkers.find(m => String(m.jobData.job_number).trim() == jNum);
                if (marker) clusters.addLayer(marker);

                listHTML += `
                    <div class="search-result-row">
                        <div style="font-weight:bold; color:#007bff;">${job.job_number}</div>
                        <div>${job.subdivision || '---'}</div>
                        <div>
                            <button onclick="focusOnJob('${job.job_number}')" style="background:#28a745; color:white; padding:4px; font-size:0.7em;">View</button>
                        </div>
                    </div>`;
            }
        });
        document.getElementById('searchResultsList').innerHTML = listHTML;
        document.getElementById('job-count').innerText = `Matches: ${matchCount}`;
    };

    // --- 6. EDIT MODAL ---
    window.openEditModal = function(jobNum) {
        const job = window.allRawJobs.find(j => String(j.job_number).trim() == String(jobNum).trim());
        if (!job) return;

        document.getElementById('jobModal').dataset.currentId = job.id;
        modal.style.display = 'block';
        modal.querySelector('h2').innerText = "Edit Job #" + jobNum;

        document.getElementById('new_job_number').value = job.job_number;
        document.getElementById('new_job_number').readOnly = true;
        document.getElementById('new_subdivision').value = job.subdivision || '';
        document.getElementById('new_client').value = job.client_name || '';
        document.getElementById('new_project_type').value = job.project_type || '';
        document.getElementById('new_lot_number').value = job.lot_number || '';
        document.getElementById('new_county').value = job.county || '';
        document.getElementById('address_search').value = job.address || '';
        document.getElementById('new_lat').value = job.latitude || '';
        document.getElementById('new_lng').value = job.longitude || '';
        document.getElementById('new_land_lot').value = job.land_lot || '';

        const saveBtn = document.getElementById('saveBtn');
        saveBtn.innerText = "UPDATE JOB INFO";
        saveBtn.style.background = "#ffc107";
        saveBtn.style.color = "black";
        
        saveBtn.onclick = async () => {
            const subManual = document.getElementById('new_subdivision_manual').value;
            const finalSub = subManual ? subManual : document.getElementById('new_subdivision').value;
            const clientManual = document.getElementById('new_client_manual').value;
            const finalClient = clientManual ? clientManual : document.getElementById('new_client').value;

            const updatedData = {
                land_lot: document.getElementById('new_land_lot').value,
                subdivision: finalSub,
                client_name: finalClient,
                project_type: document.getElementById('new_project_type').value,
                lot_number: document.getElementById('new_lot_number').value,
                county: document.getElementById('new_county').value,
                address: document.getElementById('address_search').value,
                latitude: parseFloat(document.getElementById('new_lat').value) || 0,
                longitude: parseFloat(document.getElementById('new_lng').value) || 0
            };

            const targetId = document.getElementById('jobModal').dataset.currentId;
            const { data, error } = await window._supabase.from('jobs').update(updatedData).match({ id: targetId }).select();

            if (!error) {
                alert("Job Updated!");
                modal.style.display = 'none';
                await loadJobsFromDatabase();
            } else { alert("Error: " + error.message); }
        };
    };

    // --- 7. HELPERS & BUTTONS ---
    function autofillNextJobNumber() {
        if (!window.allRawJobs || window.allRawJobs.length === 0) return;
        const numbers = window.allRawJobs.map(job => parseInt(job.job_number)).filter(num => !isNaN(num));
        if (numbers.length > 0) {
            document.getElementById('new_job_number').value = Math.max(...numbers) + 1;
        }
    }

    document.getElementById('openModalBtn').onclick = () => {
        modal.querySelector('h2').innerText = "Log New Job";
        const saveBtn = document.getElementById('saveBtn');
        saveBtn.innerText = "SAVE TO DATABASE";
        saveBtn.style.background = "#28a745";
        saveBtn.style.color = "white";
        
        document.getElementById('new_job_number').readOnly = false;
        document.getElementById('new_job_number').value = '';
        document.getElementById('new_lot_number').value = '';
        document.getElementById('address_search').value = '';
        document.getElementById('new_lat').value = '';
        document.getElementById('new_lng').value = '';

        saveBtn.onclick = async () => {
            const subManual = document.getElementById('new_subdivision_manual').value;
            const finalSub = subManual ? subManual : document.getElementById('new_subdivision').value;
            const clientManual = document.getElementById('new_client_manual').value;
            const finalClient = clientManual ? clientManual : document.getElementById('new_client').value;
            const today = new Date();
            const formattedDate = (today.getMonth() + 1) + '/' + today.getDate() + '/' + today.getFullYear();

            const jobData = {
                job_number: document.getElementById('new_job_number').value,
                subdivision: finalSub,
                client_name: finalClient,
                project_type: document.getElementById('new_project_type').value,
                lot_number: document.getElementById('new_lot_number').value,
                county: document.getElementById('new_county').value,
                address: document.getElementById('address_search').value,
                latitude: parseFloat(document.getElementById('new_lat').value),
                longitude: parseFloat(document.getElementById('new_lng').value),
                date_entered: formattedDate 
            };

            const { error } = await window._supabase.from('jobs').insert([jobData]);
            if (!error) { 
                modal.style.display = "none"; 
                alert("Job Logged!"); 
                await loadJobsFromDatabase(); 
            } else { alert("Error: " + error.message); }
        };
        autofillNextJobNumber();
        modal.style.display = "block";
    };

    window.focusOnJob = function(jobNum) {
        const m = window.allMarkers.find(marker => String(marker.jobData.job_number).trim() == String(jobNum).trim());
        if (m) { map.setView(m.getLatLng(), 18); m.openPopup(); }
    };

    document.getElementById('closeModal').onclick = () => { modal.style.display="none"; };
    document.getElementById('applyFiltersBtn').onclick = applyCivilTrackerFilters;
    document.getElementById('resetFiltersBtn').onclick = () => {
        document.getElementById('search_job_num').value = '';
        document.getElementById('search_lot_num').value = '';
        document.getElementById('search_land_lot').value = '';
        document.getElementById('search_address').value = '';
        document.getElementById('search_client').value = '';
        document.getElementById('search_subdivision').value = '';
        document.getElementById('search_date').value = '';
        document.getElementById('search_type').value = '';
        document.querySelectorAll('.sidebar input, .sidebar select').forEach(el => el.value = '');
        document.getElementById('searchResultsList').innerHTML = '';
        loadJobsFromDatabase();
    };

    document.getElementById('lookupBtn').onclick = async () => {
        const addressInput = document.getElementById('address_search');
        let address = addressInput.value;
        if (!address) return alert("Enter an address.");
        if (!address.toLowerCase().includes("ga")) address += ", Georgia";

        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&viewbox=-85.6,33.5,-81.0,35.2&bounded=1`;
        const response = await fetch(url);
        const results = await response.json();

        if (results.length > 0) {
            const lat = parseFloat(results[0].lat);
            const lon = parseFloat(results[0].lon);
            document.getElementById('new_lat').value = lat.toFixed(6);
            document.getElementById('new_lng').value = lon.toFixed(6);
            map.flyTo([lat, lon], 17); 
        } else { alert("Address not found."); }
    };

    // --- 8. WORK ORDER GENERATOR ---
    window.generateWorkOrder = function(jobNum) {
        const job = window.allRawJobs.find(j => String(j.job_number) === String(jobNum));
        if (!job) return;
        const printWindow = window.open('', '_blank', 'width=900,height=1000');
        const html = `
            <html><head><title>Work Order - ${job.job_number}</title>
            <style>
                body { font-family: Arial, sans-serif; padding: 40px; }
                table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                td { border: 2px solid black; padding: 15px; vertical-align: top; }
                .section-title { font-weight: bold; text-decoration: underline; text-align: center; display: block; margin-bottom: 5px; }
                .barcode { text-align: center; font-size: 30px; letter-spacing: 5px; }
                @media print { .no-print { display: none; } }
            </style></head>
            <body>
                <button class="no-print" onclick="window.print()">Print Report</button>
                <table>
                    <tr>
                        <td><b>Order #:</b> ${job.job_number}<br><b>Date:</b> ${job.date_entered || '---'}</td>
                        <td class="barcode">||||||||||||||||||||||<br><small>${job.job_number}</small></td>
                    </tr>
                    <tr>
                        <td><span class="section-title">Parcel Legal</span><b>Subdivision:</b> ${job.subdivision || '---'}<br><b>Lot:</b> ${job.lot_number || '---'}</td>
                        <td><span class="section-title">Client Info</span><b>Name:</b> ${job.client_name || '---'}</td>
                    </tr>
                    <tr><td colspan="2"><span class="section-title">Address</span>${job.address || '---'}</td></tr>
                </table>
            </body + ></html + >;`
        printWindow.document.write(html);
        printWindow.document.close();
    };

    // Start App
    loadJobsFromDatabase();
});
</script>
